<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الأستاذ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex">
    <aside class="w-64 bg-emerald-950 text-white p-6 hidden md:block">
        <h2 class="text-xl font-bold mb-8 text-emerald-300">فضاء الأستاذ</h2>
        <ul class="space-y-4">
            <li><a href="#" class="block py-2 px-4 rounded bg-emerald-800">الرئيسية</a></li>
            <li><a href="#" class="block py-2 px-4 rounded hover:bg-emerald-900 transition">نقاط المراقبة المستمرة</a></li>
            <li><a href="#" class="block py-2 px-4 rounded hover:bg-emerald-900 transition">المراسلات والتقارير</a></li>
            <li><a href="/" class="block py-2 px-4 rounded hover:bg-red-600 transition mt-10 text-red-300 hover:text-white">تسجيل الخروج</a></li>
        </ul>
    </aside>
    <main class="flex-1 p-8">
        <header class="bg-white shadow rounded-xl p-6 mb-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">مرحباً بك، الأستاذ ({{ username }})</h1>
            <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-semibold">قسم الأستاذ</span>
        </header>
        <div class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-lg font-bold text-gray-700 mb-4">إدارة الأقسام والتقييمات</h2>
            <p class="text-gray-500">إدخال العلامات، الملاحظات البيداغوجية، والتواصل مع الإدارة والتنسيق التربوي.</p>
        </div>
    </main>
</body>
</html>
