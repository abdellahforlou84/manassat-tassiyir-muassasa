<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المدير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex">
    <aside class="w-64 bg-slate-900 text-white p-6 hidden md:block">
        <h2 class="text-xl font-bold mb-8 text-blue-400">إدارة المدير</h2>
        <ul class="space-y-4">
            <li><a href="#" class="block py-2 px-4 rounded bg-blue-700">الرئيسية</a></li>
            <li><a href="#" class="block py-2 px-4 rounded hover:bg-slate-800 transition">هيئة التسيير</a></li>
            <li><a href="#" class="block py-2 px-4 rounded hover:bg-slate-800 transition">الإحصائيات العامة</a></li>
            <li><a href="/" class="block py-2 px-4 rounded hover:bg-red-600 transition mt-10 text-red-400 hover:text-white">تسجيل الخروج</a></li>
        </ul>
    </aside>
    <main class="flex-1 p-8">
        <header class="bg-white shadow rounded-xl p-6 mb-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">مرحباً بك، السيد المدير ({{ username }})</h1>
            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">صلاحيات كاملة</span>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border-r-4 border-blue-600">
                <h3 class="text-gray-500 font-semibold">المؤطرين والأساتذة</h3>
                <p class="text-3xl font-bold text-gray-800 mt-2">--</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-r-4 border-green-600">
                <h3 class="text-gray-500 font-semibold">الأفواج التربوية</h3>
                <p class="text-3xl font-bold text-gray-800 mt-2">--</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-r-4 border-amber-600">
                <h3 class="text-gray-500 font-semibold">حالة الحضور اليومي</h3>
                <p class="text-3xl font-bold text-gray-800 mt-2">منتظم</p>
            </div>
        </div>
    </main>
</body>
</html>
